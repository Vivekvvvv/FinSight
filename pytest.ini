[pytest]
norecursedirs = archive .cursor .pytest_cache .pytest-basetemp node_modules

testpaths =
    backend/tests
    tests

# 标记定义
markers =
    network: 标记为网络依赖测试（可能超时或失败）
    integration: 标记为集成测试（依赖复杂状态）

filterwarnings =
    ignore:ARC4 has been moved to cryptography.hazmat.decrepit.ciphers.algorithms.ARC4.*:Warning
    ignore:datetime\.datetime\.utcnow\(\) is deprecated.*:DeprecationWarning
