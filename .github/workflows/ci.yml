name: FinSight CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  stage1-frontend-lint:
    name: Stage 1 - Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-vue/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend-vue
      - name: Run frontend lint
        run: npm run lint --prefix frontend-vue

  stage2-backend-tests:
    name: Stage 2 - Backend Tests
    runs-on: ubuntu-latest
    needs: [stage1-frontend-lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python scripts/check_requirements_lock.py
          pip install -r requirements.txt
      - name: Run supply-chain audit
        run: |
          pip-audit -r requirements.txt
          cyclonedx-py requirements requirements.txt --output-file sbom.json
      - name: Run backend pytest suite
        run: >-
          pytest -q backend/tests
          tests/rag_quality/test_rag_quality.py
          tests/regression/test_mock_tools_contract.py
          tests/unit/test_trace_emitter.py
      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-sbom
          path: sbom.json

  stage3-retrieval-unit:
    name: Stage 3 - Retrieval Eval Unit
    runs-on: ubuntu-latest
    needs: [stage2-backend-tests]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run retrieval eval runner tests
        run: pytest -q tests/retrieval_eval/test_retrieval_eval_runner.py
      - name: Run rag_qualityV2 fast tests
        run: pytest -q tests/rag_qualityV2

  stage4-retrieval-gate:
    name: Stage 4 - Retrieval Gate
    runs-on: ubuntu-latest
    needs: [stage3-retrieval-unit]
    services:
      pgvector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify retrieval dependency versions
        run: |
          python - <<'PY'
          import importlib.metadata as md
          import transformers

          flag_ver = md.version("FlagEmbedding")
          st_ver = md.version("sentence-transformers")
          tf_ver = transformers.__version__
          print(f"FlagEmbedding={flag_ver}")
          print(f"sentence-transformers={st_ver}")
          print(f"transformers={tf_ver}")

          major = int(tf_ver.split(".")[0])
          if major >= 6:
              raise SystemExit("transformers major version must be <6 for FlagEmbedding compatibility")
          PY
      - name: Check embedding backend visibility
        run: |
          python - <<'PY'
          from backend.rag.embedder import EmbeddingService
          svc = EmbeddingService()
          model = svc.model_name
          print(f"Embedding backend: {model}")
          if model == "hash":
              print("::warning::RAG embedding backend is hash fallback (degraded mode).")
          PY
      - name: Run retrieval quality gate (memory)
        run: |
          python tests/retrieval_eval/run_retrieval_eval.py \
            --backend memory \
            --gate \
            --report-prefix ci_memory \
            --output-dir tests/retrieval_eval/reports/memory
      - name: Run retrieval quality gate (postgres)
        env:
          RAG_EMBEDDING: bge-m3
          RAG_V2_VECTOR_DIM: "1024"
          RAG_V2_POSTGRES_DSN: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          python tests/retrieval_eval/run_retrieval_eval.py \
            --backend postgres \
            --postgres-dsn "$RAG_V2_POSTGRES_DSN" \
            --gate \
            --report-prefix ci_postgres \
            --output-dir tests/retrieval_eval/reports/postgres
      - name: Verify retrieval gate summaries
        run: |
          test -f tests/retrieval_eval/reports/memory/gate_summary.json
          test -f tests/retrieval_eval/reports/postgres/gate_summary.json
      - name: Upload retrieval reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: retrieval-reports
          path: |
            tests/retrieval_eval/reports/

  stage5-frontend-build:
    name: Stage 5 - Frontend Build
    runs-on: ubuntu-latest
    needs: [stage4-retrieval-gate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-vue/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend-vue
      - name: Build frontend
        run: npm run build --prefix frontend-vue
      - name: Upload frontend build artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-build
          path: |
            frontend-vue/dist/

  stage6-e2e-frontend-mock:
    name: Stage 6 - E2E Frontend Mock
    runs-on: ubuntu-latest
    needs: [stage5-frontend-build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-vue/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend-vue
      - name: Install Playwright browser
        working-directory: frontend-vue
        run: npx playwright install --with-deps chromium
      - name: Run e2e tests
        run: npm run test:e2e --prefix frontend-vue
      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts
          path: |
            frontend-vue/playwright-report/
            frontend-vue/test-results/
          if-no-files-found: ignore

  stage7-e2e-compose:
    name: Stage 7 - Compose Smoke
    runs-on: ubuntu-latest
    needs: [stage5-frontend-build]
    env:
      POSTGRES_DB: finsight_ci
      POSTGRES_USER: finsight_ci
      POSTGRES_PASSWORD: ci_postgres_password
      OPENAI_COMPATIBLE_API_KEY: ci-placeholder-key
      OPENAI_COMPATIBLE_API_BASE: http://127.0.0.1:9/v1
      OPENAI_COMPATIBLE_MODEL: gpt-4o-mini
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef
      API_AUTH_KEYS: ci-e2e-token
      API_AUTH_DEFAULT_USER_ID: ci-user
      API_AUTH_DEFAULT_EMAIL: ci-user@example.invalid
      VITE_RAG_INSPECTOR_DEV_ACCESS_TOKEN: ci-e2e-token
      RAG_EMBEDDING: hash
      RAG_V2_ALLOW_MEMORY_FALLBACK: "true"
      E2E_API_TOKEN: ci-e2e-token
      E2E_USER_EMAIL: ci-user@example.invalid
      E2E_SESSION_ID: private:ci-user:default
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start compose stack
        run: docker compose up -d --build
      - name: Verify frontend proxies backend health
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1
      - name: Show compose logs
        if: always()
        run: docker compose logs --no-color | tee compose.log
      - name: Stop compose stack
        if: always()
        run: docker compose down -v
      - name: Upload compose e2e artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compose-smoke-artifacts
          path: compose.log
          if-no-files-found: error

  stage8-artifact-bundle:
    name: Stage 8 - Bundle Artifacts
    runs-on: ubuntu-latest
    needs: [stage6-e2e-frontend-mock, stage7-e2e-compose]
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: bundled-artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-artifact-bundle
          path: bundled-artifacts/
          if-no-files-found: error
