<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>FinSight Research Terminal</title>
    <!-- 首屏前应用持久化外观，避免刷新时闪一下默认主题/布局（FOUC）。
         逻辑与 src/stores/theme.ts 的 DEFAULT_APPEARANCE / apply() 保持一致；
         Vue 挂载后 store 会用校验过的值再 apply 一次，这里只负责首帧不闪。 -->
    <script>
      (function () {
        try {
          var D = { mode: 'system', accent: 'default', font: 'auto', radius: 'auto', density: 'default', sidebar: 'inset', layout: 'default', direction: 'ltr', contentWidth: 'full' };
          var s = {};
          try { s = JSON.parse(localStorage.getItem('finsight-appearance') || '{}') || {}; } catch (e) { s = {}; }
          var legacy = localStorage.getItem('finsight-theme');
          var mode = s.mode || (legacy === 'dark' || legacy === 'light' || legacy === 'system' ? legacy : D.mode);
          var dark = mode === 'dark' || (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var el = document.documentElement, d = el.dataset;
          d.theme = dark ? 'dark' : 'light';
          d.accent = s.accent || D.accent;
          d.font = s.font || D.font;
          d.radius = s.radius || D.radius;
          d.density = s.density || D.density;
          d.sidebar = s.sidebar || D.sidebar;
          d.shellLayout = s.layout || D.layout;
          d.contentWidth = s.contentWidth || D.contentWidth;
          el.dir = s.direction || D.direction;
        } catch (e) { /* 忽略：store 挂载后会重新 apply */ }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
