# Prometheus配置文件
# 用于监控FinSight API服务

global:
  scrape_interval: 15s       # 默认抓取间隔
  evaluation_interval: 15s   # 告警规则评估间隔
  external_labels:
    cluster: 'finsight-prod'
    service: 'finsight-api'

# 告警规则文件
rule_files:
  - 'rules/alerts.yml'

# 抓取配置
scrape_configs:
  # FinSight API服务
  - job_name: 'finsight-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:8000']
        labels:
          app: 'finsight'
          env: 'production'

  # Prometheus自监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
